name: CI

# Typecheck and test every PR and every push to main. The committed bundle in
# dist/ ships to customer embeds on the next version tag, so broken source must
# not reach main unnoticed. See publish-cdn.yml for the release build.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --watchAll=false --maxWorkers=2

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Check browser test types and lint
        run: |
          npm run typecheck:browser
          npx eslint e2e scripts/build-browser-test-bundle.cjs scripts/visual-audit.mjs scripts/visual-audit.test.mjs playwright.config.ts
      - name: Build current source with bounded workers
        env:
          # Existing CRA warnings are reported by lint, not promoted during build.
          CI: "false"
        run: npm run build:browser-tests
      - name: Test optional visual audit without API calls
        run: npm run test:visual-audit
      - name: Test desktop and mobile layouts
        run: xvfb-run --auto-servernum npm run test:browser -- --max-failures=2
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-browser-evidence
          path: |
            output/playwright/report
            output/playwright/results
          retention-days: 14

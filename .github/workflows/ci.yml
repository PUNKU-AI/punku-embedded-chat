name: CI

# Typecheck and test every PR and every push to main. Releases use the same
# bundle build and browser/Gemini checks before uploading the tested artifact.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --watchAll=false --maxWorkers=2

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user pwuser --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the release bundle
        uses: ./.github/actions/check-widget-bundle
        with:
          real_gemini: ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

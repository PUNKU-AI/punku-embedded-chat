name: CI

# Typecheck and test every PR and every push to main. Releases call the same
# widget checks: one bundle build, one browser job per profile, one Gemini review.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --watchAll=false --maxWorkers=2

      - name: Test development and deployment tools
        run: node --test --test-concurrency=1 scripts/dev-server.test.cjs scripts/lint-compatibility.test.cjs scripts/publish-header-icon-overrides.test.cjs

  widget:
    uses: ./.github/workflows/widget-checks.yml
    with:
      real_gemini: ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

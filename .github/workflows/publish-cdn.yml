name: Publish widget bundle to CDN (S3 + CloudFront)

# Builds the widget and uploads the single self-contained bundle to the
# PUNKU-controlled CDN origin (S3) so customer embeds never depend on a single
# third-party CDN (jsDelivr) again. Triggered on version tags — the existing
# release ritual: `git tag v1.0.7 && git push --tags`.
#
# INACTIVE until the AWS resources + repo variables exist: the job is guarded on
# the CDN_DEPLOY_ROLE_ARN repo *variable*, so tagging before setup is a no-op
# (no red/failed runs). See SELF_HOSTING.md for the one-time setup.
#
# The validate job calls widget-checks.yml, as CI does: one bundle build, one
# browser job per profile, then one real Gemini review. A manual run with
# dry_run checks the selected branch's commit and never starts the publish job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish, e.g. v1.0.7"
        required: true
      dry_run:
        description: "Dry run: check the selected branch's commit as this tag. Nothing is published."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tag:
    name: release tag
    if: ${{ vars.CDN_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.ref.outputs.tag }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: Validate version tag
        id: ref
        shell: bash
        env:
          RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DRY_RUN_SHA: ${{ github.sha }}
        run: |
          TAG="${RELEASE_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release requires an existing version tag such as v1.0.7."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "ref=$DRY_RUN_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run: checking $DRY_RUN_SHA as $TAG. The publish job does not run."
          else
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: tag
    uses: ./.github/workflows/widget-checks.yml
    with:
      ref: ${{ needs.tag.outputs.ref }}
      real_gemini: true
      check_committed_bundle: true
      bundle_artifact_name: widget-tested-release-bundle
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  publish:
    needs: [tag, validate]
    if: needs.validate.result == 'success' && needs.tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.CDN_AWS_REGION }} # e.g. eu-central-1
      BUCKET: ${{ vars.CDN_BUCKET }} # e.g. punku-cdn (primary origin, eu-central-1)
      BUCKET_BACKUP: ${{ vars.CDN_BUCKET_BACKUP }} # e.g. punku-cdn-backup (failover origin, eu-west-1) — optional
      DIST_ID: ${{ vars.CDN_CLOUDFRONT_ID }} # CloudFront distribution id
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # Keep the publisher and validation runtime aligned.

      - name: Install locked icon dependencies
        run: npm ci

      - name: Download the tested bundle
        uses: actions/download-artifact@v4
        with:
          name: widget-tested-release-bundle
          path: .

      - name: Resolve version paths
        id: v
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          MAJOR="${TAG%%.*}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG  (floating alias: chat/$MAJOR/)"

      # Header icons go first. A new bundle must never reach customers before
      # the icon files that it loads by name. See scripts/build-lucide-icons.js.
      - name: Build header icon set
        run: node scripts/build-lucide-icons.js

      - name: Verify downloaded bundle before publication
        run: node scripts/release-bundle.cjs verify-committed

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CDN_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload header icons -> chat/icons/lucide/ (primary + failover origin)
        run: scripts/upload-lucide-icons.sh

      - name: Upload pinned (immutable) copy -> chat/<tag>/bundle.min.js (primary + failover origin)
        run: |
          for B in "$BUCKET" ${BUCKET_BACKUP:+"$BUCKET_BACKUP"}; do
            echo "uploading pinned copy to s3://$B"
            aws s3 cp dist/build/static/js/bundle.min.js \
              "s3://$B/chat/${{ steps.v.outputs.tag }}/bundle.min.js" \
              --content-type "application/javascript; charset=utf-8" \
              --cache-control "public, max-age=31536000, immutable"
          done

      - name: Upload floating major copy -> chat/<major>/bundle.min.js (primary + failover origin)
        run: |
          for B in "$BUCKET" ${BUCKET_BACKUP:+"$BUCKET_BACKUP"}; do
            echo "uploading floating copy to s3://$B"
            aws s3 cp dist/build/static/js/bundle.min.js \
              "s3://$B/chat/${{ steps.v.outputs.major }}/bundle.min.js" \
              --content-type "application/javascript; charset=utf-8" \
              --cache-control "public, max-age=300, s-maxage=300"
          done

      - name: Invalidate floating path on CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/chat/${{ steps.v.outputs.major }}/bundle.min.js"

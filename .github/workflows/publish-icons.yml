name: Publish header icons to CDN

# Uploads the Lucide icon set and optional header icon overrides to the CDN.
# Neither upload requires a widget release.
#
# Run it by hand:
#   - once, before the first widget release that loads icons from the CDN
#   - after a `lucide-static` update, when the platform offers new icons
#
# publish-cdn.yml runs the same two scripts on every version tag.

on:
  workflow_dispatch:
    inputs:
      manifest_only:
        description: "Publish only the configured header icon overrides"
        type: boolean
        default: false

permissions:
  id-token: write # OIDC: assume the deploy role without storing static AWS keys
  contents: read

jobs:
  publish-icons:
    if: ${{ vars.CDN_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.CDN_AWS_REGION }}
      BUCKET: ${{ vars.CDN_BUCKET }}
      BUCKET_BACKUP: ${{ vars.CDN_BUCKET_BACKUP }}
      DIST_ID: ${{ vars.CDN_CLOUDFRONT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Test header icon override publisher
        run: node --test --test-concurrency=1 scripts/publish-header-icon-overrides.test.cjs

      - name: Validate header icon overrides
        id: overrides
        env:
          WIDGET_HEADER_ICON_OVERRIDES_JSON: ${{ secrets.WIDGET_HEADER_ICON_OVERRIDES_JSON }}
        run: node scripts/publish-header-icon-overrides.cjs

      - name: Install dependencies
        if: ${{ !inputs.manifest_only }}
        run: npm ci

      - name: Build header icon set
        if: ${{ !inputs.manifest_only }}
        run: node scripts/build-lucide-icons.js

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CDN_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload header icons -> chat/icons/lucide/ (primary + failover origin)
        if: ${{ !inputs.manifest_only }}
        run: scripts/upload-lucide-icons.sh

      - name: Upload header icon overrides (primary + failover origin)
        if: steps.overrides.outputs.publish == 'true'
        run: |
          set -euo pipefail
          task_buckets=("$BUCKET")
          if [ -n "${BUCKET_BACKUP:-}" ]; then
            task_buckets+=("$BUCKET_BACKUP")
          fi
          for task_bucket in "${task_buckets[@]}"; do
            aws s3 cp build-icons/header-icon-overrides.json "s3://$task_bucket/chat/header-icon-overrides.json" \
              --content-type "application/json" --cache-control "public, max-age=300" --only-show-errors
          done
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" \
            --paths "/chat/header-icon-overrides.json" > /dev/null
